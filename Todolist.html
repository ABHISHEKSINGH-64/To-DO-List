```html
<!DOCTYPE html>
<html>
<head>
<title>Todo List CRUD</title>

<style>
body{
    font-family: Arial;
    text-align:center;
    background:#f4f4f4;
}

.container{
    width:400px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.2);
}

input{
    padding:10px;
    width:70%;
}

button{
    padding:10px;
    margin:5px;
    cursor:pointer;
}

ul{
    list-style:none;
    padding:0;
}

li{
    background:#eee;
    margin:8px 0;
    padding:10px;
    border-radius:5px;
}
</style>

</head>

<body>

<div class="container">

<h2>Todo List</h2>

<input type="text" id="taskInput" placeholder="Enter task">
<button onclick="addTask()">Add</button>

<ul id="taskList"></ul>

</div>

<script>

let tasks = [];

// CREATE
function addTask(){

    let input = document.getElementById("taskInput");
    let task = input.value;

    if(task === ""){
        alert("Enter a task");
        return;
    }

    tasks.push(task);
    input.value="";

    displayTasks();
}


// READ
function displayTasks(){

    let list = document.getElementById("taskList");
    list.innerHTML="";

    tasks.forEach((task,index)=>{

        list.innerHTML += `
        <li>
        ${task}
        <button onclick="editTask(${index})">Edit</button>
        <button onclick="deleteTask(${index})">Delete</button>
        </li>
        `;

    });
}


// UPDATE
function editTask(index){

    let newTask = prompt("Edit task:",tasks[index]);

    if(newTask !== null){
        tasks[index] = newTask;
        displayTasks();
    }

}


// DELETE
function deleteTask(index){

    tasks.splice(index,1);
    displayTasks();

}

</script>

</body>
</html>
```
